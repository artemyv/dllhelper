# Inspired by https://github.com/sonarsource-cfamily-examples/windows-msbuild-opencppcoverage-gh-actions-sc/blob/main/.github/workflows/build.yml

name: Build on Windows
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install CMake 4.2.1
        uses: jwlawson/actions-setup-cmake@802fa1a2c4e212495c05bf94dba2704a92a472be # v2.0.2
        with:
          cmake-version: '4.2.1'
          # Explicitly disable auth to avoid "Bad credentials" from fork PRs
          github-api-token: ''
      - name: Run Build
        run: |
          cmake --version
          cmake --workflow action_win
      - name: Run gcov to translate `.gcda` files into `.gcov` readable by humans and SonarCloud
        shell: pwsh
        run: |
          $covDir = "coverage-dir"
          New-Item -ItemType Directory -Force -Path $covDir | Out-Null
          Push-Location $covDir
          # Locate llvm-cov (prefer VS-installed one, fallback to PATH)
          $llvmCov = "llvm-cov.exe"
          # Collect object files from build directory (exclude third-party deps and CompilerId)
          $objs = Get-ChildItem ..\build -Recurse -Include *.obj | Where-Object { $_.FullName -notmatch "\\_deps\\" -and $_.FullName -notmatch "CompilerId" }
          if ($objs.Count -eq 0) { Write-Host "No object files found for coverage"; Pop-Location; exit 0 }
          # Write reports into current directory using long filenames to avoid absolute path directories on Windows
          & $llvmCov gcov -l ($objs | ForEach-Object { $_.FullName })
          Pop-Location
      - name:  Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9  # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Put the name of your token here
        with:
          args: >
            --define sonar.cfamily.compile-commands=build/compile_commands.json
            --define sonar.cfamily.gcov.reportsPath=coverage-dir
