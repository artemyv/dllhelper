# Inspired by https://github.com/sonarsource-cfamily-examples/linux-cmake-gcovr-gh-actions-sc/blob/main/.github/workflows/build.yml
name: Build (Windows → Linux merge) and Sonar
permissions:
  contents: read
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  windows:
    name: Build + Coverage (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CMake 4.2.1
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.1'
          github-api-token: ''
      - name: Configure + Build + Test (Windows)
        shell: pwsh
        run: |
          cmake --version
          cmake --workflow action_win
      - name: Convert coverage to .gcov (Windows via llvm-cov)
        shell: pwsh
        run: |
          $llvmCov = "llvm-cov.exe"
          New-Item -ItemType Directory -Path coverage-windows -Force | Out-Null
          Push-Location coverage-windows
          $objs = Get-ChildItem ..\build -Recurse -Include *.obj | Where-Object { $_.FullName -notmatch "\\_deps\\" -and $_.FullName -notmatch "CompilerId" }
          if ($objs.Count -eq 0) { Write-Host "No object files found for coverage"; Pop-Location; exit 0 }
          & $llvmCov gcov -l ($objs | ForEach-Object { $_.FullName })
          Pop-Location
      - name: Upload coverage artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: coverage-windows

  linux:
    name: Build + Merge Coverage + Sonar (Linux)
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CMake 4.2.1
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.1'
          github-api-token: ''
      - name: Configure + Build + Test (Linux)
        shell: bash
        run: |
          cmake --version
          cmake --workflow action
      - name: Convert coverage to .gcov (Linux)
        run: |
          mkdir coverage-dir
          cd coverage-dir
          find .. -name '*.o' -not -path '*/_deps/*' | xargs gcov --preserve-paths
          cd ..
      - name: Download Windows coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-windows
          path: artifacts/windows
      - name: Merge coverage (Windows + Linux)
        run: |
          cp -R artifacts/windows/*.gcov coverage-dir/ || true
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=build/compile_commands.json
            --define sonar.cfamily.gcov.reportsPath=coverage-dir
